name: 功能建议 / Feature request
description: 描述使用场景和希望改善的体验。
title: '[Feature] '
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题 / Use case
      description: 你在什么情况下遇到不便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的操作或效果 / Proposed behavior
    validations:
      required: true
